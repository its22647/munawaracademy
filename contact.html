<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Munawar Academy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> BACK TO DASHBOARD</a>
    </div>

    <div class="admission-ui">
        <div class="ui-header">
            <h2>ADMISSION OPEN</h2>
            <p>Secure your future with professional guidance.</p>
        </div>
        
        <div class="contact-row">
            <div class="contact-box">
                <i class="fas fa-location-dot" style="font-size: 2rem; color: var(--accent);"></i>
                <h3>CAMPUS</h3>
                <p>Rani Market, Railway Scheme 1, Chaklala, Rawalpindi.</p>
            </div>
            <div class="contact-box">
                <i class="fas fa-phone" style="font-size: 2rem; color: var(--accent);"></i>
                <h3>WHATSAPP/CALL</h3>
                <div class="number-badge">
                    <span id="num">0345 5513573</span>
                    <button class="btn-copy" onclick="copyNum()">COPY</button>
                </div>
            </div>
        </div>
        
        <a href="tel:03455513573" class="call-btn-large">CALL OFFICE NOW</a>
    </div>

    <script>
        function copyNum() {
            var n = document.getElementById("num").innerText;
            navigator.clipboard.writeText(n).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
