<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Munawar Science Academy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> BACK TO DASHBOARD</a>
    </div>

    <div class="admission-ui">
        <div class="ui-header">
            <h2>ADMISSION INQUIRY</h2>
            <p>Start your journey toward academic brilliance</p>
        </div>
        
        <div class="contact-row">
            <div class="contact-box">
                <i class="fas fa-map-marked-alt" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 20px;"></i>
                <h3>CAMPUS LOCATION</h3>
                <p>Rani Market, Railway Scheme 1, Chaklala, Rawalpindi.</p>
            </div>
            <div class="contact-box">
                <i class="fas fa-phone-volume" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 20px;"></i>
                <h3>DIRECT CONTACT</h3>
                <div class="number-badge">
                    <span id="p-num">0345 5513573</span>
                    <button class="btn-copy" onclick="copyNum()">COPY</button>
                </div>
            </div>
        </div>
        
        <a href="tel:03455513573" class="call-btn-large">CALL OFFICE NOW</a>
    </div>

    <script>
        function copyNum() {
            var n = document.getElementById("p-num").innerText;
            navigator.clipboard.writeText(n).then(() => {
                alert("Phone number copied to clipboard!");
            });
        }
    </script>
</body>
</html>
